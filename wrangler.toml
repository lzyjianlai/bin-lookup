name = "bin-lookup"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
  { pattern = "bin.lzyjl.com", custom_domain = true }
]

# Secrets(用 wrangler secret put 设置,绝不写在这里):
